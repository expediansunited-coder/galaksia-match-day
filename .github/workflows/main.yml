name: Daily Matchday 11s Post

on:
  schedule:
    - cron: '07 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-birefnet-${{ runner.os }}-v1

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write secret files
        run: |
          printf '%s' '${{ secrets.CREDENTIALS_JSON }}' > credentials.json
          printf '%s' '${{ secrets.META_CONFIG_JSON }}' > meta_config.json

      - name: Generate images
        run: python matchday.py --generate-only

      - name: Commit generated images
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add output/*.png 2>/dev/null || echo "no images to add"
          git commit -m "Add generated matchday images" || echo "nothing to commit"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Wait for raw GitHub URLs
        run: sleep 15

      - name: Post to Meta
        run: python matchday.py --post-only

      - name: Remove generated images
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git rm -f output/*.png || echo "nothing to remove"
          git commit -m "Clean up generated matchday images" || echo "nothing to commit"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
